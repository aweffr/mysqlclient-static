name: Publish

on:
  workflow_dispatch:
  push:
    tags: ['build-*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: tested-*
          path: bundle
          merge-multiple: true
      - name: Publish the tested wheels
        run: uv publish --trusted-publishing always bundle/wheelhouse/*.whl

  install:
    needs: publish
    uses: ./.github/workflows/check-index.yml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: tested-*
          path: bundle
          merge-multiple: true
      - name: Create versioned Releases with tested wheels and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 -m ci.release --bundle bundle --target "$RELEASE_SHA"
