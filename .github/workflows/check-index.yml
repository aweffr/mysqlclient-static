name: Verify published packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: Install from index · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      MCS_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Check build and test tooling
        if: matrix.platform == 'linux'
        run: |
          uv run python -m unittest discover -s tests/unit -v
          uv run ruff check .
      - name: Build the symbol-conflict test fixture
        run: |
          mkdir -p release
          if [ "$MCS_PLATFORM" = macos ]; then
            clang -dynamiclib -fPIC -O2 ci/collision.c -o release/collision.dylib
          else
            gcc -shared -fPIC -O2 ci/collision.c -o release/collision.so
          fi
      - name: Install and audit published packages with pip and UV
        run: uv run python -m ci.check_index --index 'pypi'
      - name: Install macOS test services
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install mysql@8.0 mysql@8.4 redis
          brew upgrade mysql@8.0 mysql@8.4
      - name: Re-test the distributions downloaded from the index
        run: |
          if [ "$MCS_PLATFORM" = macos ]; then
            uv run python -m ci.run_macos
          else
            uv run python -m ci.run_e2e
          fi
      - name: Consolidate installation results
        if: always()
        run: |
          uv run python -m ci.report
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: index-results-${{ matrix.platform }}
          path: reports/

